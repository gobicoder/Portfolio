<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOBINATH | Contact</title>

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

<!-- Inline CSS -->
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Inter',sans-serif; }
body { background:#0f172a; color:#cbd5f5; line-height:1.6; }
.container { max-width:1200px; margin:auto; padding:60px 20px; }
h2 { font-size:2rem; text-align:center; margin-bottom:20px; color:#fff; margin-top:80px; scroll-margin-top:100px; }
h3 { color:#38bdf8; margin-bottom:10px; }
p { color:#94a3b8; }
a { color:#e5e7eb; text-decoration:none; transition:color 0.3s; }
a:hover { color:#38bdf8; }

/* Navigation */
.main-nav { width:100%; background-color:#1f1f1f; color:#fff; padding:15px 0; position:fixed; top:0; left:0; z-index:1000; box-shadow:0 2px 5px rgba(0,0,0,0.3); }
.main-nav .container { display:flex; justify-content:space-between; align-items:center; max-width:1200px; margin:auto; padding:0 20px; }
.main-nav .logo h4 { color:#38bdf8; font-size:1.5rem; margin:0; }
.main-nav .nav-links { list-style:none; display:flex; gap:30px; }
.main-nav .nav-links li a { color:#fff; text-decoration:none; font-weight:500; padding:5px 0; display:flex; align-items:center; gap:5px; transition: color 0.3s, border-bottom 0.3s; }
.main-nav .nav-links li a:hover, .main-nav .nav-links li a.active { color:#38bdf8; border-bottom:2px solid #38bdf8; }
.hamburger { display:none; font-size:1.5rem; cursor:pointer; color:#38bdf8; }
@media(max-width:768px){ .hamburger{display:block;} .main-nav .nav-links{position:absolute;top:60px;right:0;background:#1f1f1f;flex-direction:column;width:200px;padding:15px;gap:15px;transform:translateX(100%);transition:transform 0.3s ease;} .main-nav .nav-links.active{transform:translateX(0);} .main-nav .nav-links li a{padding:10px 0;} }

/* Contact Grid */
.contact-grid { display:flex; gap:50px; flex-wrap:wrap; justify-content:center; align-items:flex-start; }
.contact-info, .contact-form { flex:1 1 300px; }
.contact-info h3, .contact-form h3 { margin-bottom:20px; }
.info-item { display:flex; align-items:flex-start; gap:10px; margin-bottom:15px; }
.info-item i { color:#38bdf8; font-size:1.3rem; min-width:28px; display:flex; justify-content:center; margin-top:3px; }
.info-item a { word-break: break-all; }

/* Contact Form */
.contact-form { background:#020617; padding:25px; border-radius:12px; border:1px solid #1e293b; box-shadow:0 20px 40px rgba(0,0,0,0.45); text-align:left; }
.contact-form .form-group { position:relative; margin-bottom:20px; }
.contact-form i { position:absolute; left:12px; color:#38bdf8; font-size:1rem; top:50%; transform:translateY(-50%); pointer-events:none; }
.contact-form input, .contact-form textarea { width:100%; padding:12px 12px 12px 40px; border-radius:8px; border:1px solid #1e293b; background:#0f172a; color:#e5e7eb; font-size:0.95rem; }
.contact-form textarea { min-height:120px; resize:vertical; }
.contact-form button { width:100%; padding:12px; background:#38bdf8; color:#020617; border:none; border-radius:8px; font-weight:700; cursor:pointer; transition:all 0.3s ease; }
.contact-form button:hover { background:#22c55e; box-shadow:0 8px 20px rgba(56,189,248,0.4); transform:translateY(-2px); }

/* Fade-up animation */
.fade-up { opacity:0; transform:translateY(30px); transition: all 0.8s ease; }
.fade-up.in-view { opacity:1; transform:translateY(0); }

/* Footer */
.footer { background:#1f2937; color:#e5e7eb; padding:20px 0; text-align:center; font-size:0.9rem; }

/* Responsive */
@media(max-width:768px){ .contact-grid{flex-direction:column; text-align:center;} .contact-info{text-align:center;} .info-item{justify-content:center;} .contact-form{padding:20px;} }
</style>
</head>

<body>

<header class="main-nav">
  <div class="container">
    <div class="logo"><h4>GOBINATH</h4></div>
    <div class="hamburger"><i class="fas fa-bars"></i></div>
    <ul class="nav-links">
      <li><a href="index.html"><i class="fas fa-home"></i> Home</a></li>
      <li><a href="about.html"><i class="fas fa-user"></i> About</a></li>
      <li><a href="experience.html"><i class="fas fa-briefcase"></i> Experience</a></li>
      <li><a href="projects.html"><i class="fas fa-folder-open"></i> Projects</a></li>
      <li><a href="contact.html" class="active"><i class="fas fa-envelope"></i> Contact</a></li>
    </ul>
  </div>
</header>

<div class="container">
  <h2 class="fade-up">Contact Me</h2>
  <p class="fade-up" style="text-align:center; margin-bottom:40px;">Interested in working together or have a question? Let’s talk.</p>

  <div class="contact-grid">
    <div class="contact-info fade-up">
      <h3>Contact Details</h3>
      <div class="info-item"><i class="fas fa-envelope"></i><a href="mailto:gobinathcoder@gmail.com">Gobinath E</a></div>
      <div class="info-item"><i class="fab fa-linkedin"></i><a href="https://in.linkedin.com/in/gobinathe">Gobinath E</a></div>
      <div class="info-item"><i class="fab fa-github"></i><a href="#">github.com/yourusername</a></div>
    </div>

    <form class="contact-form fade-up">
      <h3>Send a Message</h3>
      <div class="form-group"><i class="fas fa-user"></i><input type="text" placeholder="Your Name" required></div>
      <div class="form-group"><i class="fas fa-envelope"></i><input type="email" placeholder="Your Email" required></div>
      <div class="form-group"><i class="fas fa-comment-dots"></i><textarea placeholder="Your Message" required></textarea></div>
      <button type="submit">Send Message</button>
    </form>
  </div>
</div>

<footer class="footer">
  <div class="container"><p>© 2026 GOBINATH E. All rights reserved.</p></div>
</footer>

<!-- Inline JS -->
<script>
// Hamburger toggle
const hamburger = document.querySelector('.hamburger');
const navLinks = document.querySelector('.nav-links');
hamburger.addEventListener('click',()=>{ navLinks.classList.toggle('active'); });

// Fade-up animation on scroll
const faders=document.querySelectorAll('.fade-up');
const appearOptions={threshold:0.2, rootMargin:"0px 0px -50px 0px"};
const appearOnScroll=new IntersectionObserver((entries,observer)=>{
entries.forEach(entry=>{
if(entry.isIntersecting){ entry.target.classList.add('in-view'); observer.unobserve(entry.target); }
});
},appearOptions);
faders.forEach(fader=>appearOnScroll.observe(fader));

// Contact form submit
const form=document.querySelector('.contact-form');
form.addEventListener('submit',e=>{
e.preventDefault();
alert("Message sent successfully!");
form.reset();
});
</script>

</body>
</html>
