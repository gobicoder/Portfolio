<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOBINATH | Projects</title>

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

<!-- Inline CSS -->
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Inter',sans-serif; }
body { background:#0f172a; color:#cbd5f5; line-height:1.6; }
.container { max-width:1200px; margin:auto; padding:60px 20px; }
h2 { font-size:2rem; text-align:center; margin-bottom:30px; color:#fff; margin-top:80px; scroll-margin-top:100px; }

/* Navigation */
.main-nav { width:100%; background-color:#1f1f1f; color:#fff; padding:15px 0; position:fixed; top:0; left:0; z-index:1000; box-shadow:0 2px 5px rgba(0,0,0,0.3); }
.main-nav .container { display:flex; justify-content:space-between; align-items:center; max-width:1200px; margin:auto; padding:0 20px; }
.main-nav .logo h4 { color:#38bdf8; font-size:1.5rem; margin:0; }
.main-nav .nav-links { list-style:none; display:flex; gap:30px; }
.main-nav .nav-links li a { color:#fff; text-decoration:none; font-weight:500; padding:5px 0; display:flex; align-items:center; gap:5px; transition: color 0.3s, border-bottom 0.3s; }
.main-nav .nav-links li a:hover, .main-nav .nav-links li a.active { color:#38bdf8; border-bottom:2px solid #38bdf8; }
.hamburger { display:none; font-size:1.5rem; cursor:pointer; color:#38bdf8; }
@media(max-width:768px){ .hamburger{display:block;} .main-nav .nav-links{position:absolute;top:60px;right:0;background:#1f1f1f;flex-direction:column;width:200px;padding:15px;gap:15px;transform:translateX(100%);transition:transform 0.3s ease;} .main-nav .nav-links.active{transform:translateX(0);} .main-nav .nav-links li a{padding:10px 0;} }

/* Project Grid */
.projects-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:20px; }
.project-card { background:#1e293b; border:1px solid #38bdf8; border-radius:10px; padding:20px; transition:transform 0.3s, box-shadow 0.3s; }
.project-card:hover { transform:translateY(-5px); box-shadow:0 8px 20px rgba(0,0,0,0.5); }
.project-card h3 { color:#38bdf8; margin-bottom:10px; }
.project-card p { color:#cbd5f5; font-size:0.95rem; margin-bottom:10px; }
.project-card a { color:#60a5fa; text-decoration:none; font-weight:500; transition:color 0.3s; }
.project-card a:hover { color:#38bdf8; }

/* Fade-up animation */
.fade-up { opacity:0; transform:translateY(30px); transition: all 0.8s ease; }
.fade-up.in-view { opacity:1; transform:translateY(0); }

/* Footer */
.footer { background:#1f2937; color:#e5e7eb; padding:20px 0; text-align:center; font-size:0.9rem; }
</style>
</head>

<body>

<header class="main-nav">
  <div class="container">
    <div class="logo"><h4>GOBINATH</h4></div>
    <div class="hamburger"><i class="fas fa-bars"></i></div>
    <ul class="nav-links">
      <li><a href="index.html"><i class="fas fa-home"></i> Home</a></li>
      <li><a href="about.html"><i class="fas fa-user"></i> About</a></li>
      <li><a href="experience.html"><i class="fas fa-briefcase"></i> Experience</a></li>
      <li><a href="projects.html" class="active"><i class="fas fa-folder-open"></i> Projects</a></li>
      <li><a href="contact.html"><i class="fas fa-envelope"></i> Contact</a></li>
    </ul>
  </div>
</header>

<div class="container">
  <h2 class="fade-up">Projects</h2>
  <div class="projects-grid" id="projectsGrid"></div>
</div>

<footer class="footer">
  <div class="container">
    <p>© 2026 GOBINATH E. All rights reserved.</p>
  </div>
</footer>

<!-- Inline JS -->
<script>
// Hamburger toggle
const hamburger = document.querySelector('.hamburger');
const navLinks = document.querySelector('.nav-links');
hamburger.addEventListener('click',()=>{ navLinks.classList.toggle('active'); });

// Projects data
const projects=[
{title:"Portfolio Website",description:"A responsive personal portfolio website built with HTML, CSS, and JS showcasing my skills, experience, and projects.",link:"#"},
{title:"Inventory Management App",description:"A web application to manage inventory, track products, and generate reports. Built with JavaScript and Node.js.",link:"#"},
{title:"Digital Forensics Tool",description:"Developed a tool for forensic analysis of digital evidence, enabling investigation of file metadata and recovery of deleted files.",link:"#"},
{title:"Community Service Portal",description:"Web portal for volunteer registration, project tracking, and community engagement for social service initiatives.",link:"#"}
];

// Render project cards
const projectsGrid=document.getElementById('projectsGrid');
projects.forEach((proj)=>{
const card=document.createElement('div');
card.className="project-card fade-up";
card.innerHTML=`<h3>${proj.title}</h3><p>${proj.description}</p><a href="${proj.link}" target="_blank">View Project <i class="fas fa-external-link-alt"></i></a>`;
projectsGrid.appendChild(card);
});

// Fade-up on scroll
const faders=document.querySelectorAll('.fade-up');
const appearOptions={threshold:0.2, rootMargin:"0px 0px -50px 0px"};
const appearOnScroll=new IntersectionObserver((entries,observer)=>{
entries.forEach(entry=>{
if(entry.isIntersecting){ entry.target.classList.add('in-view'); observer.unobserve(entry.target); }
});
},appearOptions);
faders.forEach(fader=>appearOnScroll.observe(fader));
</script>

</body>
</html>
